name: Offline security and release gate
on:
  workflow_dispatch:
  release:
    types: [published]
concurrency:
  group: offline-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Provision locked Chromium revision 1243 (153.0.8010.12)
        run: |
          npx playwright-core install --with-deps chromium
          node -e 'console.log("CHROMIUM_PATH="+require("playwright-core").chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run package
      - run: npm run check:package
      - run: npm audit
      - run: git diff --check
