<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarmoNova</title>
  <link rel="stylesheet" href="src/popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="brand">
      <img src="icons/icon48.png" width="40" height="40" alt="">
      <div>
        <h1>HarmoNova</h1>
        <p id="status">Checking status…</p>
      </div>
    </header>

    <label class="toggle-row">
      <span>Enable HarmoNova</span>
      <input id="enabled" type="checkbox" role="switch">
    </label>

    <div class="actions">
      <button id="settings" type="button">Settings</button>
      <button id="original" type="button">Open original HN</button>
    </div>
  </main>
  <script src="src/popup.js"></script>
</body>
</html>
